# Publish @supersuit/docusaurus-preset-wiki to npm through OIDC trusted publishing.
#
# WHY THIS EXISTS. Publishing by hand needed a one-time password in a browser on every
# release, which put a human round trip in front of every fix reaching the wikis that
# consume this package. On 2026-09-15 that blocked a CSS fix from reaching pcs.wiki and
# victory-book-wiki for the whole day while every other wiki already had it.
#
# It is also the direction npm is forcing. Their own banner: "npm tokens that bypass 2FA
# are being restricted, account changes (Aug 2026) and direct publishing (Jan 2027)."
# A long-lived automation token in a secret would work today and stop working on a date
# somebody else picked.
#
# HOW THE TRUST WORKS. There is no token here and no NODE_AUTH_TOKEN, deliberately.
# GitHub mints a short-lived OIDC identity for this workflow, npm verifies it against the
# trusted publisher configured on the package, and the publish is authorised by WHO ran it
# rather than by a secret anyone holding it could use. The trusted-publisher record on npm
# names this repository AND this filename, so renaming this file breaks publishing until
# the record is updated. That is the intended behaviour rather than a trap.
#
# HOW TO RELEASE. Bump the version in package.json, add the CHANGELOG entry, commit, then:
#     git tag v1.3.1 && git push origin v1.3.1
# The tag is the trigger. The version guard below refuses a tag that disagrees with
# package.json, because a mismatch publishes a version nobody wrote a changelog for.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and stop before publishing"
        type: boolean
        default: true

permissions:
  contents: read
  # The one permission OIDC needs. Without it the publish fails with an auth error that
  # does not mention OIDC at all.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing landed in npm 11.5.1. setup-node ships whatever npm came
      # with the Node build, so pin it rather than hoping. An older npm fails by asking
      # for a token, which reads like a credential problem and is not one.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # The package is the product, so it is built and tested before it is published,
      # never after. `prepack` builds again on publish; that is cheap and keeps the
      # published artifact honest if this step is ever reordered.
      - run: npm run build
      - run: npm test

      # The fixture test builds a whole Docusaurus site from the packed package and
      # asserts the framework's own CSS survives minification into the bundle. It is the
      # slowest check here (~25s) and the only one that would have caught the blockquote
      # rule being dropped, so it runs on every release rather than on a schedule.
      - run: npm run test:fixture

      - name: Refuse a tag that disagrees with package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            echo "Publishing here would ship a version with no CHANGELOG entry."
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      - name: Refuse a version already on npm
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "@supersuit/docusaurus-preset-wiki@$PKG" version >/dev/null 2>&1; then
            echo "$PKG is already published. Bump the version."
            exit 1
          fi
          echo "$PKG is not on npm yet"

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        # No NODE_AUTH_TOKEN and no .npmrc auth line. The OIDC identity above is the
        # entire credential; adding a token here would silently take precedence over it
        # and put the 2FA prompt back.
        run: npm publish

      - name: Dry run only
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "All checks passed. Nothing published (dry run)."
